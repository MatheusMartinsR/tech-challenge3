spring.application.name=techChallenge3

# Datasource (PostgreSQL - ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/techchallenge
spring.datasource.username=techchallenge
spring.datasource.password=techchallenge
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ (ver docker-compose.yml)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# JWT
# Secret de exemplo para desenvolvimento local - SUBSTITUA em produção (ex.: via variável de ambiente JWT_SECRET)
jwt.secret=${JWT_SECRET:dGVjaC1jaGFsbGVuZ2UtMy1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbg==}
jwt.expiration-ms=3600000

# Consumo de mensagens: tentativas e destino em caso de falha.
# Cada evento é reprocessado até 3 vezes além da primeira tentativa, com espera
# crescente (1s, 2s, 4s). Esgotadas as tentativas, a mensagem é rejeitada sem
# reenfileiramento e o broker a encaminha para a DLQ (ver NotificacaoRabbitConfig).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
# Sem isto, uma exceção que escape do retry devolveria a mensagem à fila em laço infinito.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
