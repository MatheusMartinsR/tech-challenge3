spring.application.name=agendamento-service-test

# Banco em memória para os testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Testes validam o mesmo schema versionado, mas nao carregam os dados de demo.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Não tenta conectar/consumir de um broker real durante os testes;
# o TestRabbitTemplate despacha as mensagens diretamente para os @RabbitListener.
spring.rabbitmq.listener.simple.auto-startup=false

jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdW5pdC10ZXN0cy1vbmx5LWRvLW5vdC11c2U=
jwt.expiration-ms=3600000
