spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
jwt.secret=${JWT_SECRET:dGVjaC1jaGFsbGVuZ2UtMy1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbg==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
spring.graphql.graphiql.enabled=${GRAPHQL_GRAPHIQL_ENABLED:false}
