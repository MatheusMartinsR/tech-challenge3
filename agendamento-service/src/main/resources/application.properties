spring.application.name=agendamento-service

server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/techchallenge
spring.datasource.username=techchallenge
spring.datasource.password=techchallenge
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
