spring.application.name=agendamento-service

server.port=8080

# Datasource proprio deste servico (ver docker-compose.yml).
# O Servico de Notificacoes tem o seu, em outro banco: nenhum dos dois le as
# tabelas do outro.
spring.datasource.url=jdbc:postgresql://localhost:5432/techchallenge
spring.datasource.username=techchallenge
spring.datasource.password=techchallenge
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ (ver docker-compose.yml)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# JWT
# Secret de exemplo para desenvolvimento local - SUBSTITUA em producao (ex.: via variavel de ambiente JWT_SECRET)
jwt.secret=${JWT_SECRET:dGVjaC1jaGFsbGVuZ2UtMy1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbg==}
jwt.expiration-ms=3600000
