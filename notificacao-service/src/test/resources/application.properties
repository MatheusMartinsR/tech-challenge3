spring.application.name=notificacao-service-test

# Banco em memoria para os testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Nao tenta conectar/consumir de um broker real durante os testes;
# o TestRabbitTemplate despacha as mensagens diretamente para os @RabbitListener.
spring.rabbitmq.listener.simple.auto-startup=false
