spring.application.name=notificacao-service

# Porta diferente da do Servico de Agendamento: sao dois processos, e em
# desenvolvimento os dois sobem na mesma maquina.
server.port=8081

# Datasource proprio deste servico (ver docker-compose.yml): so a tabela
# `notificacoes` vive aqui. Os dados de paciente chegam no payload do evento,
# entao este servico nao acessa o banco do Servico de Agendamento.
spring.datasource.url=jdbc:postgresql://localhost:5433/techchallenge_notificacao
spring.datasource.username=notificacao
spring.datasource.password=notificacao
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ (ver docker-compose.yml)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Consumo de mensagens: tentativas e destino em caso de falha.
# Cada evento e reprocessado ate 3 vezes alem da primeira tentativa, com espera
# crescente (1s, 2s, 4s). Esgotadas as tentativas, a mensagem e rejeitada sem
# reenfileiramento e o broker a encaminha para a DLQ (ver NotificacaoRabbitConfig).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
# Sem isto, uma excecao que escape do retry devolveria a mensagem a fila em laco infinito.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
