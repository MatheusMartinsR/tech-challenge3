# ---------------------------------------------------------------------------
# Integração Contínua.
#
# Roda a mesma verificação que fazemos na máquina (`./mvnw verify`) a cada push
# e a cada pull request, num runner limpo do GitHub. O ganho principal está nos
# testes de Testcontainers: o runner sempre tem Docker, então eles nunca se
# auto-pulam como acontece numa máquina com o Docker Desktop desligado.
#
# Não exige nenhum secret: os testes usam H2 e Testcontainers, e o jwt.secret
# de teste é um valor fixo de desenvolvimento.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    # Rede interrompida ou container que não sobe não podem prender o job
    # indefinidamente. A execução normal fica bem abaixo disto.
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o JDK 21
        uses: actions/setup-java@v4
        with:
          # O projeto compila com release 17; o JDK 21 é o mesmo usado nos
          # Dockerfiles (eclipse-temurin:21).
          java-version: '21'
          distribution: 'temurin'
          # Guarda o ~/.m2 entre execuções. Sem isto, todo run rebaixa o
          # Spring Boot inteiro do zero.
          cache: maven

      - name: Garantir que o mvnw é executável
        # O repositório é mantido a partir do Windows, onde o bit de execução não
        # existe. Se ele se perder no índice do git, o runner Linux falharia com
        # "Permission denied" antes de compilar qualquer coisa.
        run: chmod +x ./mvnw

      - name: Compilar e rodar a suíte
        # -B (batch mode) desliga a saída interativa e colorida, que polui o log.
        # `verify` roda os testes e gera os relatórios do JaCoCo.
        run: ./mvnw -B verify

      - name: Publicar relatórios de cobertura
        # Roda mesmo se a etapa anterior falhar: quando um teste quebra, é
        # justamente aí que os relatórios ajudam.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '*/target/site/jacoco/'
          if-no-files-found: ignore

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/'
          if-no-files-found: ignore
