services:

  postgres-agendamento:
    image: postgres:16-alpine
    container_name: techchallenge-postgres-agendamento
    environment:
      POSTGRES_DB: ${POSTGRES_AGENDAMENTO_DB}
      POSTGRES_USER: ${POSTGRES_AGENDAMENTO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AGENDAMENTO_PASSWORD}
    ports:
      - "${POSTGRES_AGENDAMENTO_PORT}:5432"
    volumes:
      - postgres-agendamento-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AGENDAMENTO_USER} -d ${POSTGRES_AGENDAMENTO_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [hospital-network]

  postgres-notificacao:
    image: postgres:16-alpine
    container_name: techchallenge-postgres-notificacao
    environment:
      POSTGRES_DB: ${POSTGRES_NOTIFICACAO_DB}
      POSTGRES_USER: ${POSTGRES_NOTIFICACAO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICACAO_PASSWORD}
    ports:
      - "${POSTGRES_NOTIFICACAO_PORT}:5432"
    volumes:
      - postgres-notificacao-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_NOTIFICACAO_USER} -d ${POSTGRES_NOTIFICACAO_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [hospital-network]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: techchallenge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"             # AMQP
      - "${RABBITMQ_MANAGEMENT_PORT}:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [hospital-network]

  agendamento-service:
    build:
      context: .
      dockerfile: agendamento-service/Dockerfile
    container_name: techchallenge-agendamento
    depends_on:
      postgres-agendamento:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-agendamento:5432/${POSTGRES_AGENDAMENTO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_AGENDAMENTO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_AGENDAMENTO_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      GRAPHQL_GRAPHIQL_ENABLED: "true"
    ports:
      - "${AGENDAMENTO_PORT}:8080"
    networks: [hospital-network]

  notificacao-service:
    build:
      context: .
      dockerfile: notificacao-service/Dockerfile
    container_name: techchallenge-notificacao
    depends_on:
      postgres-notificacao:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notificacao:5432/${POSTGRES_NOTIFICACAO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_NOTIFICACAO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_NOTIFICACAO_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${NOTIFICACAO_PORT}:8081"
    networks: [hospital-network]

volumes:
  postgres-agendamento-data:
  postgres-notificacao-data:

networks:
  hospital-network:
    driver: bridge
