# ---------------------------------------------------------------------------
# Stack local completa: os dois serviços, seus bancos e o broker.
#
# Cada serviço tem o SEU banco. Isso é deliberado: dois serviços lendo o mesmo
# banco seriam um monolito distribuído, não dois microsserviços. O Serviço de
# Notificações recebe os dados do paciente no payload do evento, então nunca
# precisa acessar o banco do Serviço de Agendamento.
#
# `docker compose up --build` sobe tudo. As variáveis vêm do arquivo .env.
# ---------------------------------------------------------------------------
services:

  postgres-agendamento:
    image: postgres:16-alpine
    container_name: techchallenge-postgres-agendamento
    environment:
      POSTGRES_DB: ${POSTGRES_AGENDAMENTO_DB}
      POSTGRES_USER: ${POSTGRES_AGENDAMENTO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AGENDAMENTO_PASSWORD}
    ports:
      - "${POSTGRES_AGENDAMENTO_PORT}:5432"
    volumes:
      - postgres-agendamento-data:/var/lib/postgresql/data
    healthcheck:
      # O -d e obrigatorio: sem ele o pg_isready assume que o banco tem o mesmo
      # nome do usuario, tenta conectar num banco inexistente e o Postgres
      # registra "FATAL: database ... does not exist" a cada verificacao.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AGENDAMENTO_USER} -d ${POSTGRES_AGENDAMENTO_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-notificacao:
    image: postgres:16-alpine
    container_name: techchallenge-postgres-notificacao
    environment:
      POSTGRES_DB: ${POSTGRES_NOTIFICACAO_DB}
      POSTGRES_USER: ${POSTGRES_NOTIFICACAO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICACAO_PASSWORD}
    ports:
      - "${POSTGRES_NOTIFICACAO_PORT}:5432"
    volumes:
      - postgres-notificacao-data:/var/lib/postgresql/data
    healthcheck:
      # Ver a nota no healthcheck do postgres-agendamento: aqui o nome do banco
      # difere do nome do usuario, entao omitir o -d gera FATAL no log.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_NOTIFICACAO_USER} -d ${POSTGRES_NOTIFICACAO_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: techchallenge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"          # protocolo AMQP
      - "${RABBITMQ_MANAGEMENT_PORT}:15672" # painel (http://localhost:15672 - guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  agendamento-service:
    build:
      # Contexto na raiz: o módulo depende do POM pai e do `common`.
      context: .
      dockerfile: agendamento-service/Dockerfile
    container_name: techchallenge-agendamento
    depends_on:
      postgres-agendamento:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-agendamento:5432/${POSTGRES_AGENDAMENTO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_AGENDAMENTO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_AGENDAMENTO_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${AGENDAMENTO_PORT}:8080"

  notificacao-service:
    build:
      context: .
      dockerfile: notificacao-service/Dockerfile
    container_name: techchallenge-notificacao
    depends_on:
      postgres-notificacao:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notificacao:5432/${POSTGRES_NOTIFICACAO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_NOTIFICACAO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_NOTIFICACAO_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${NOTIFICACAO_PORT}:8081"

volumes:
  postgres-agendamento-data:
  postgres-notificacao-data:
