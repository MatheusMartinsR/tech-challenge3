services:
  postgres:
    image: postgres:16-alpine
    container_name: techchallenge-postgres
    environment:
      POSTGRES_DB: techchallenge
      POSTGRES_USER: techchallenge
      POSTGRES_PASSWORD: techchallenge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techchallenge"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: techchallenge-rabbitmq
    ports:
      - "5672:5672"   # protocolo AMQP
      - "15672:15672" # painel de gerenciamento (http://localhost:15672 - guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
